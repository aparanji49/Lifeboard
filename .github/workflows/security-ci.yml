name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  security-and-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lifeboard/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify lockfile integrity (no mutation after install)
        run: git diff --exit-code -- package-lock.json

      - name: Lint
        run: npm run lint

      - name: Audit dependencies (high+)
        # Prisma 6 has a known high-severity advisory chain (prisma -> @prisma/config -> effect)
        # that requires a Prisma 7 migration to resolve. Until then, keep the report but
        # don't fail the workflow.
        continue-on-error: true
        run: npm audit --audit-level=high
